[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
