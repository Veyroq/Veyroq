# Railway configuration for the persistent Veyroq API & Auth backend (server.js).
# Pair with Vercel for static edge hosting (landing/, console/, docs/, legal/).
# Do not enable Railway auto-deploy on unverified branches; promote only after GitHub CI passes.

"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
